services:
  - type: web
    name: mastermin
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Containers see the host's CPU count, so glibc creates one malloc arena
      # per thread.  With a scan, a diagnostics probe and the request threads all
      # alive that means dozens of arenas, each holding freed pages instead of
      # returning them -- the classic way a Python service grows past its limit
      # without leaking a single object.  Two arenas keeps the footprint flat.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Return freed memory to the OS instead of caching it in the allocator.
      - key: PYTHONMALLOC
        value: "malloc"
      - key: WATCHLIST
        value: SPY,QQQ,IWM,AAPL,NVDA,TSLA,AMD,PLTR,SOFI,INTC,MU,COIN,MARA,SNAP,F
      - key: REFRESH_SEC
        value: "180"
      - key: SIMS
        value: "3000"
      # The instance has ample headroom (the scan peaks well under 300MB with
      # gigabytes free), and a wider scan is what makes the first cold view
      # populate quickly rather than trickling in for minutes.  Three workers
      # is the point where a pass still fills the page quickly on one CPU
      # without four full analyses holding four option chains in memory at
      # once.
      - key: SCAN_WORKERS
        value: "2"
      - key: ANALYZE_SLOTS
        value: "2"
      # One pool for every network fan-out in the process, with its threads
      # created at boot.  Starting a thread while a pass is running is what
      # used to stall the scan on this instance.
      - key: IO_WORKERS
        value: "16"
      # A ticker gets room to finish: the providers answer in seconds from a
      # fast connection and in tens of seconds from here.
      - key: ANALYZE_TIMEOUT
        value: "90"
      - key: INLINE_WAIT_SEC
        value: "20"
      # Each real expiry date in the chain gets its own answer.  Four covers the
      # nearest weekly plus the following one on most names; more than that and
      # the pass gets slower without telling a short-dated trader anything new.
      - key: MAX_EXPIRY_VIEWS
        value: "4"
      # Signs the login cookie.  Render generates it once, so a restart no longer
      # logs you out.
      - key: SECRET_KEY
        generateValue: true
      # The dashboard password.  `sync: false` keeps it out of this repository:
      # Render prompts for it in the dashboard and stores it only there.  Until it
      # is set the app falls back to a known default and the page says so.
      - key: SITE_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: ALPHAVANTAGE_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
